services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: repoxray
      POSTGRES_PASSWORD: repoxray
      POSTGRES_DB: repoxray
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repoxray"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  